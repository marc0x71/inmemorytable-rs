[package]
name = "inmemorytable"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Marco Bollero <marc0x71@yahoo.it>"]
description = "A Rust library for managing typed records in POSIX shared memory with IPC semaphore synchronization"
readme = "README.md"
repository = "https://github.com/marc0x71/inmemorytable-rs"
homepage = "https://github.com/marc0x71/inmemorytable-rs"

[dependencies]
thiserror = "2.0.17"
nix = { version = "0.30", features = ["mman", "fs"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
chrono = "0.4"

[dev-dependencies]
rand = "0.9"

[[example]]
name = "writer"
path = "examples/writer.rs"

[[example]]
name = "reader"
path = "examples/reader.rs"

[[example]]
name = "cleanup"
path = "examples/cleanup.rs"
